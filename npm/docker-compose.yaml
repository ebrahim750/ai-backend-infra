services:
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped

    ports:
      - '80:80' # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '127.0.0.1:81:81' # Admin Web Port

    environment:
      TZ: "Africa/Nairobi"

    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    
    networks:
     - npm_proxy 


networks:
  npm_proxy:
    name: npm_proxy
